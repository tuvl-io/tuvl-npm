name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    # A private repository may use the self-hosted runner in CI_RUNS_ON; a public one never does,
    # because a fork's pull request would run its code there.
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # all work lands on develop; main only receives a release from it
  branch-flow:
    name: main takes pull requests from develop only
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') || 'ubuntu-latest' }}
    permissions: {}
    steps:
      - name: Check the head branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REF" != "develop" || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::main only takes pull requests from develop; open this one against develop"
            exit 1
          fi
