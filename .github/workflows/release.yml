name: Release to npm

# Pushing a tag vX.Y.Z (or vX.Y.Z-beta.N) that is on main publishes @tuvl/client at that version.
#
# No token is stored: npm trusted publishing (OIDC) lets npm check that the publish comes from this workflow, run for
# the `npm-publish` environment. It is set up once on npmjs.com (@tuvl/client > Settings > Trusted publisher >
# GitHub Actions: tuvl-io / tuvl-npm / release.yml / npm-publish); see CONTRIBUTING.md. It needs a cloud-hosted
# runner, npm 11.5.1 or newer and Node 22.14 or newer.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish @tuvl/client
    runs-on: ubuntu-latest
    # restricted to v*.*.* tags in the repository's settings; the npm trusted publisher names it too
    environment: npm-publish

    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag must be checked against main

      - name: Tag must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; merge the change to main and tag it there"
            exit 1
          fi

      - name: Tag must match package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_NAME#v}" != "$PKG_VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Use npm 11.5.1 or newer
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install --global "npm@^11.5.1"
          fi
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test the packed package
        run: make smoke

      # `npm publish`, not pnpm: only npm does the trusted-publishing exchange. No NODE_AUTH_TOKEN is set; --provenance
      # makes a publish that cannot be attested fail instead of going out without it.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ARGS=(--access public --provenance)
          if [[ "$VERSION" == *-* ]]; then
            PRE="${VERSION#*-}"
            ARGS+=(--tag "${PRE%%.*}") # 2.1.0-beta.3 -> beta
          fi
          npm publish "${ARGS[@]}"
