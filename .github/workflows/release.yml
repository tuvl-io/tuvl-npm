name: Release to npm

# Pushing a tag vX.Y.Z (or vX.Y.Z-beta.N) that is on main publishes @tuvl/client at that version.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish @tuvl/client
    # A private repository may use the self-hosted runner in CI_RUNS_ON; a public one never does,
    # because a fork's pull request would run its code there.
    runs-on: ${{ github.event.repository.private && fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') || 'ubuntu-latest' }}

    permissions:
      contents: read
      id-token: write # npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tag must be checked against main

      - name: Tag must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; merge the change to main and tag it there"
            exit 1
          fi

      - name: Tag must match package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF_NAME#v}" != "$PKG_VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # `npm publish`, not pnpm: setup-node's .npmrc token is used directly (pnpm does not
      # forward NODE_AUTH_TOKEN, which causes E404 on scoped packages).
      # Provenance needs a public repository on a GitHub-hosted runner; a private one publishes without.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ARGS=(--access public)
          if [[ "$VERSION" == *-* ]]; then
            PRE="${VERSION#*-}"
            ARGS+=(--tag "${PRE%%.*}") # 2.1.0-beta.3 -> beta
          fi
          if [[ "${{ github.event.repository.private }}" == "true" ]]; then
            ARGS+=(--no-provenance)
          else
            ARGS+=(--provenance)
          fi
          npm publish "${ARGS[@]}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
